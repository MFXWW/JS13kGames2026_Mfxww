<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicorn 矢量画布原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>🦄 Unicorn · pixelated 矢量动画原型</h1>
  <p class="sub">先在 tools 里验证大体架构，之后再并入游戏。</p>

  <div class="stage-wrap">
    <div class="stage-shell" id="shell">
      <canvas id="stage" width="96" height="120"></canvas>
      <div id="grid" class="grid-overlay hidden"></div>
    </div>
  </div>

  <div class="keys-hint">
    <span><kbd>A</kbd> 朝左(原地奔跑)</span>
    <span><kbd>D</kbd> 朝右(原地奔跑)</span>
    <span><kbd>Space</kbd> 跳跃(滞空 1s)</span>
  </div>
  <p class="hint2">仅动画演示：角色固定站位不移动，A/D 只切换朝向并播奔跑姿态，Space 播 1s 跳跃。</p>

  <div class="panel">
    <label class="row">
      <span>播放 / 暂停</span>
      <button id="btnPlay" type="button">⏸ 暂停</button>
    </label>

    <label class="row">
      <span>像素网格</span>
      <input id="gridToggle" type="checkbox">
    </label>
  </div>

  <p class="hint">角色：方形身体 / 四条粗线腿 / 斜置方形脖子 / 三角形头 / 金色角，均为矢量几何，数值为 unicorn.js 顶部 const。状态机：待机 → A/D 奔跑 → Space 跳跃(1s 滞空)。</p>
</main>
<script src="unicorn.js"></script>
</body>
</html>
