<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fallen rainbow</title>
    <style> *{margin:0;padding:0;box-sizing:border-box}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#111;color:#aaa;font-family:'Courier New','Consolas',monospace;overflow:hidden;user-select:none}#a{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:90%;max-width:540px;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;z-index:50;pointer-events:none;opacity:0;transition:opacity .6s ease}#a.aa{opacity:1}#b{font-size:13px;letter-spacing:2px;color:#555}#c{font-size:12px;letter-spacing:1px;color:#555}#e{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}#f{border:1px solid #333;background:#000;z-index:10}#g{display:none}#i,#l,#n,#r,#q{position:fixed;inset:0;pointer-events:none}#i{display:none;z-index:100;background:rgba(0,0,0,.75)}#n{display:none;z-index:300;background:rgba(0,0,0,.85)}#l{background:#000;z-index:200;opacity:0;transition:opacity .4s ease}#r{background:#000;z-index:400;opacity:0;transition:opacity .5s ease}#q{z-index:350;display:none}#i.ab,#n.ab,#r{display:flex;flex-direction:column;align-items:center;justify-content:center}#l.ab{opacity:1}#r.ab{opacity:1;pointer-events:auto}#q.ab{display:block;animation:glitchFlash .9s steps(2,end)}#j,#o{text-align:center;padding:0 20px;white-space:pre-line;animation:fadeUp .5s ease-out}#j{font-size:clamp(18px,4vw,30px);max-width:500px;line-height:1.6;color:#ccc}#o{font-size:clamp(16px,3.2vw,24px);max-width:520px;line-height:1.7;color:#ccc}#k,#p,#s .z{font-size:12px;letter-spacing:3px}#k,#p{animation:fadeUp .9s ease-out}#k{margin-top:30px;color:#555}#p{margin-top:34px;color:#555}@keyframes fadeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}#m{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:210;pointer-events:none;text-align:center;opacity:0;transition:opacity .6s ease;padding:0 20px}#m.ab{opacity:1}#m .u{font-size:14px;letter-spacing:3px;color:#555}#m .v{font-size:11px;letter-spacing:2px;margin-top:10px;white-space:pre-line;color:#555}#m .w{font-size:13px;letter-spacing:2px;margin-top:14px;color:#555}#h{position:absolute;top:8px;right:10px;z-index:60;font-size:12px;letter-spacing:2px;color:#999;opacity:0;transition:opacity .6s ease;pointer-events:none}#h.aa{opacity:1}#d{position:fixed;top:20px;left:20px;z-index:500;color:#ccc}#d.aa{color:#f88}#s{max-width:560px;padding:0 24px;text-align:center;line-height:1.9;font-size:14px;letter-spacing:1px}#s .x{font-size:16px;letter-spacing:4px;margin-bottom:22px;color:#ccc}#s .y{white-space:pre-line}#s .z{margin-top:34px;color:#555}@keyframes glitchFlash{0%{background:rgba(255,0,80,.18)}20%{background:rgba(0,255,255,.18)}40%{background:rgba(255,255,0,.14)}60%{background:rgba(255,0,255,.16)}80%{background:rgba(0,255,128,.14)}100%{background:rgba(255,255,255,0)}}#t{position:fixed;inset:auto 20px 18px 14px;z-index:450;display:none;touch-action:none}#t button{width:60px;height:60px;margin:0 14px 0 0;border-radius:50%;background:#fff1;color:#fffa}#t button:nth-child(3){margin-left:auto}#t button:ab{background:#fff4}@media (pointer:coarse){#t{display:flex}}</style>
</head>
<body>

    <div id="a">
        <span id="b">Fallen rainbow</span>
        <span id="c">—</span>
    </div>

    <div id="d">♪</div>

    <div id="e">
        <canvas id="f"></canvas>
        <canvas id="g"></canvas>
        <div id="h">deaths: 0</div>
    </div>

    <div id="i">
        <div id="j"></div>
        <div id="k">[ SPACE to try again ]</div>
    </div>

    <div id="l"></div>
    <div id="m">
        <div class="u"></div>
        <div class="v"></div>
        <div class="w"></div>
    </div>

    <div id="n">
        <div id="o"></div>
        <div id="p">[ LEFT ] let go   [ RIGHT ] keep it</div>
    </div>

    <div id="q"></div>

    <div id="r">
        <div id="s">
            <div class="x"></div>
            <div class="y"></div>
            <div class="z"></div>
        </div>
    </div>

    <div id="t"><button>◀</button><button>▶</button><button>▲</button></div>

<script src="game.rolled.js"></script>
</body>
</html>
