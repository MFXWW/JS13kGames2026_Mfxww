<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style> *{margin:0;padding:0;box-sizing:border-box}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#111;color:#aaa;font-family:'Courier New','Consolas',monospace;overflow:hidden;user-select:none}#a{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:90%;max-width:540px;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.6s ease}#a.y{opacity:1}#b{font-size:13px;letter-spacing:2px;color:#555}#c{font-size:12px;letter-spacing:1px;color:#666}#e{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}#f{border:1px solid #333;background:#000;z-index:10}#g{display:none}#h{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:100;pointer-events:none;background:rgba(0,0,0,0.75)}#h.z{display:flex;flex-direction:column;align-items:center;justify-content:center}#i{font-size:clamp(18px,4vw,30px);letter-spacing:1px;text-align:center;color:#bbb;padding:0 20px;max-width:500px;line-height:1.6;animation:fadeUp 0.5s ease-out}#j{font-size:12px;letter-spacing:3px;color:#444;margin-top:30px;animation:fadeUp 0.9s ease-out}@keyframes fadeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}#k{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:200;pointer-events:none;opacity:0;transition:opacity 0.4s ease}#k.z{opacity:1}#l{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:210;pointer-events:none;text-align:center;opacity:0;transition:opacity 0.6s ease;padding:0 20px}#l.z{opacity:1}#l .s{font-size:14px;letter-spacing:3px;color:#555}#l .t{font-size:11px;letter-spacing:2px;color:#333;margin-top:10px}#l .u{font-size:13px;letter-spacing:2px;color:#666;margin-top:14px}#d{position:fixed;top:20px;right:20px;z-index:60;font-size:12px;letter-spacing:2px;color:#999;opacity:0;transition:opacity 0.6s ease;pointer-events:none}#d.y{opacity:1}#m{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:300;pointer-events:none;background:rgba(0,0,0,0.85)}#m.z{display:flex;flex-direction:column;align-items:center;justify-content:center}#n{font-size:clamp(16px,3.2vw,24px);letter-spacing:1px;text-align:center;color:#ccc;padding:0 20px;max-width:520px;line-height:1.7;animation:fadeUp 0.5s ease-out}#o{font-size:12px;letter-spacing:3px;color:#666;margin-top:34px;animation:fadeUp 0.9s ease-out}#q{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:400;opacity:0;transition:opacity 0.5s ease;display:flex;align-items:center;justify-content:center;pointer-events:none}#q.z{opacity:1;pointer-events:auto}#r{max-width:560px;padding:0 24px;text-align:center;color:#aaa;line-height:1.9;font-size:14px;letter-spacing:1px}#r .v{font-size:16px;letter-spacing:4px;color:#ccc;margin-bottom:22px}#r .x{font-size:12px;letter-spacing:3px;color:#555;margin-top:34px}#p{position:fixed;top:0;left:0;right:0;bottom:0;z-index:350;pointer-events:none;display:none}#p.z{display:block;animation:glitchFlash 0.9s steps(2,end)}#p .glitch-bar{position:absolute;left:0;right:0;height:6px;mix-blend-mode:screen}@keyframes glitchFlash{0%{background:rgba(255,0,80,0.18)}20%{background:rgba(0,255,255,0.18)}40%{background:rgba(255,255,0,0.14)}60%{background:rgba(255,0,255,0.16)}80%{background:rgba(0,255,128,0.14)}100%{background:rgba(255,255,255,0)}}</style>
</head>
<body>

    <div id="a">
